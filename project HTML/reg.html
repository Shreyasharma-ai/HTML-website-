<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color:#EAF4FF;">
    <form>
        <fieldset><center><h2>Registration</h2></center>
            <hr>
            <h2>Student Information</h2>
        <label for="Name:">Name:</label>
        <input type="text" id="Name:" name="Name:" placeholder="Enter your Name:" required>
        <br>
        <br>
        <label for="Roll Number:">Roll Number:</label>
        <input type="number" id="Roll Number:" name="Roll Number:" placeholder="Enter your Roll Number" required>
        <br>
        <br>
        <label for="Email:">Email:</label>
        <input type="email" name="Email:" id="Email:"placeholder="Enter your Email" required>
        <br>
        <br>
        <label for="Mobile number:">Mobile number:</label>
        <input type="tel" id="Mobile number:" name="Mobile number:" placeholder="Enter your Mobile Number"  title="Please enter a valid 10-digit mobile number" required>
        <br>
        <br>
        <label for="Cource:">Cource:</label>
        <select name="Cource:" id="Cource:">
            <option value="">Select Course</option>
            <option value="bca">BCA</option>
            <option value="bca-ai">BCA AI</option>
            <option value="btech">B.Tech</option>
            <option value="bba">BBA</option>
            <option value="btech ai">B.Tech AI</option>
        </select>
        <label for="year">Year:</label>
        <select name="year" id="year">
            <option value="">Select Year</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
        </select>
        <br>
        <br>
        <label for="Club:">Club:</label>
        <select name="Club:" id="Club:">
        <option value="">Choose a Club</option>
        <option value="I-Tech">I-Tech</option>
        <option value="M-Factor">M-Factor</option>
        <option value="Rock On">Rock On</option>
        <option value="Stride">Stride</option>
        <option value="Panache">Panache</option>
        <option value="Images">Images</option>
        </select>
        <br>
        <br>
        <label for="Skill:">Skill:</label>
        <input type="text" id="Skill:" name="Skill:" placeholder="Enter your Skill" required>
        <br>
        <br>
        <Label>Gender:</Label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br>
        <br>
        <label for="message">Why do you want to join the club?</label>
        <textarea  id="message" name="message" cols="40" rows="5"  placeholder="Write your message here..."></textarea>
        <input type="reset" value="Clear">
        <br>
        <br>
        <button>
        <a href="./Website.html">Back</a></button>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        </fieldset>
    
    </form>
     
</body>
</html>
